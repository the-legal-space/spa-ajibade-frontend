  /api/v1/jobs/{id}/applications:
    post:
      tags:
        - Forms
      operationId: createApplication
      summary: Apply for a job
      description: |
        Backs "Send your CV". Multipart, because it carries the CV file.

        The CV must be a PDF or DOCX of at most 5 MB. The type is checked by magic bytes, not by
        file extension, and the file is virus scanned before it is stored. Stored CVs are private
        and are only ever served through short-lived signed URLs from the admin API.

        Because multipart fields arrive as strings, `consent` is sent as the string `"true"`.

        A submission with a non-empty `website` honeypot receives a 201 with a reference, and
        nothing is stored.
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
            encoding:
              cv:
                contentType: application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        '201':
          $ref: '#/components/responses/SubmissionAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/auth/login:
    post:
      tags:
        - Admin auth
      operationId: adminLogin
      summary: Sign in
      description: |
        Returns a short-lived access token in the body and sets a rotating
        refresh token as an httpOnly cookie.

        Accounts with 2FA enabled must send `totp`; without it the response is a
        401 whose `details` carry `TOTP_REQUIRED`, which is the signal to prompt
        for a code rather than to treat the password as wrong.

        Rate limited to 5 attempts per 15 minutes per IP and email, and the
        account locks after 10 consecutive failures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: editor
              password: a-correct-horse-battery-staple
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
              example:
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn: 900
                  user:
                    id: 665f1a2b3c4d5e6f70819293
                    username: editor
                    name: Ada Nwosu
                    email: editor@spaajibade.com
                    roles:
                      - editor
                    isActive: true
                    lastLoginAt: '2026-09-23T09:12:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/auth/refresh:
    post:
      tags:
        - Admin auth
      operationId: adminRefresh
      summary: Exchange the refresh cookie for a new access token
      description: |
        Rotates the refresh token: the presented one is revoked and a new cookie
        is issued.

        Presenting an already-revoked token means it has been replayed, so the
        entire token chain for that session is revoked and the response is 401.
        Signing in again is the only way back.
      responses:
        '200':
          description: A new access token.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
              example:
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn: 900
                  user:
                    id: 665f1a2b3c4d5e6f70819293
                    username: editor
                    name: Ada Nwosu
                    email: editor@spaajibade.com
                    roles:
                      - editor
                    isActive: true
                    lastLoginAt: '2026-09-23T09:12:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/auth/logout:
    post:
      tags:
        - Admin auth
      operationId: adminLogout
      summary: Sign out
      description: Revokes the refresh token and clears the cookie. Always succeeds.
      responses:
        '204':
          description: Signed out.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
