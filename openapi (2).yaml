openapi: 3.1.0
info:
  title: SPA Ajibade & Co. Website API
  version: 1.0.0
  description: |
    Content API for the SPA Ajibade & Co. marketing website.

    Almost every piece of copy, imagery and structured content on the public site is served
    from here, so the frontend hard-codes only layout and styling.

    ## Conventions
    - Single resources return `{ "data": { ... } }`; lists return `{ "data": [ ... ], "meta": { ... } }`.
    - Errors return `{ "error": { "code", "message", "details?" } }`.
    - Dates are ISO 8601 strings. The frontend does all formatting.
    - Rich text (`body`, `bio`, `answer`, `description`) is sanitised HTML.
    - Enums are `snake_case`, with a sibling `…Label` field wherever the UI shows text.
    - Only published content is returned, unless a request carries both `?preview=true`
      and a valid admin bearer token.

    Admin endpoints are documented separately and are added to this spec in later phases.
  contact:
    name: SPA Ajibade & Co. engineering
    email: frontoffice@spaajibade.com
  license:
    name: Proprietary
    identifier: LicenseRef-SPA-Ajibade-Proprietary
servers:
  - url: http://localhost:4000
    description: Local development
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://api.spaajibade.com
    description: Production
tags:
  - name: System
    description: Liveness and diagnostics.
  - name: Site
    description: The global shell shared by every page.
  - name: Pages
    description: Composed page payloads, one request per page.
  - name: Practice areas
    description: The firm's areas of practice.
  - name: People
    description: The attorney directory.
  - name: Insights
    description: Articles, firm news and video content.
  - name: Offices
    description: Lagos, Abuja and Ibadan.
  - name: Recognition
    description: The directories that rank the firm, and the awards each has given.
  - name: Legal
    description: The Terms of Service and Privacy Policy pages.
  - name: Jobs
    description: Open vacancies.
  - name: FAQs
    description: The site-wide FAQ set.
  - name: Search
    description: Header search across the main collections.
  - name: Forms
    description: Public form submissions. All are rate limited and captcha protected.
  - name: Admin auth
    description: Sign-in, token rotation and two-factor enrolment for the admin dashboard.
  - name: Admin users
    description: Managing admin accounts and reading the audit log. Administrators only.
  - name: Admin content
    description: |
      CRUD for the nine content collections. One handler serves them all, but each
      collection has its own explicit paths and schemas (ADR-033).
  - name: Admin singletons
    description: Site settings, the ten page documents and the two legal pages.
  - name: Admin media
    description: The media library the firm uploads through — images, and PDF documents.
paths:
  /api/v1/health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Liveness probe
      description: Reports process health and whether the database responds to a ping.
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
              example:
                data:
                  status: ok
                  db: up
                  version: 1.0.0
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
