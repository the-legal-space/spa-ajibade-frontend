        - id
        - title
      description: A minimal vacancy, enough to label an application.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
    MediaUsage:
      type: object
      additionalProperties: false
      required:
        - collection
        - id
        - label
        - field
      description: One place an image is referenced, so the UI can show where it is used.
      properties:
        collection:
          type: string
        id:
          $ref: '#/components/schemas/ObjectId'
        label:
          type: string
        field:
          type: string
    MediaKind:
      type: string
      enum:
        - image
        - document
      description: |
        `image` is a JPEG, PNG, WebP or AVIF with responsive sizes and alt text. `document` is a
        PDF — the firm profile, an article's PDF — with a title and no sizes.
    MediaAdmin:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - revision
        - url
        - sizes
        - alt
        - title
        - width
        - height
        - mimeType
        - bytes
        - focalPoint
        - createdAt
        - updatedAt
        - usedBy
      description: |
        The storage key is deliberately absent; it is an internal path. The image-only fields
        (`sizes`, `alt`, `width`, `height`, `focalPoint`) are null for a document, and a
        document's `title` is never null.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        kind:
          $ref: '#/components/schemas/MediaKind'
        revision:
          type: integer
          description: |
            Send it back as `If-Match` on a metadata edit or a file
            replacement, so two editors cannot silently overwrite each other.
        url:
          type: string
        sizes:
          oneOf:
            - $ref: '#/components/schemas/ImageSizes'
            - type: 'null'
        alt:
          type:
            - string
            - 'null'
        title:
          type:
            - string
            - 'null'
        width:
          type:
            - integer
            - 'null'
        height:
          type:
            - integer
            - 'null'
        mimeType:
          type: string
        bytes:
          type: integer
        focalPoint:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - x
                - 'y'
              properties:
                x:
                  type: number
                  minimum: 0
                  maximum: 1
                'y':
                  type: number
                  minimum: 0
                  maximum: 1
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        usedBy:
          type: array
          description: Computed from the media reference registry, not stored (ADR-013).
          items:
            $ref: '#/components/schemas/MediaUsage'
    MediaUploadRequest:
      type: object
      additionalProperties: false
      required:
        - file
      description: |
        An image needs `alt`; a document needs `title`. Omitting the one the kind needs is a 400.
      properties:
        file:
          type: string
          format: binary
          description: |
            An image: JPEG, PNG, WebP or AVIF, at most 10 MB. A document: a PDF, at most 20 MB.
            Either way the type is verified by magic bytes, never by name or declared type.
        kind:
          type: string
          enum:
            - image
            - document
          default: image
        alt:
          type: string
          minLength: 1
          maxLength: 300
          description: Required for an image. Not accepted for a document.
        title:
          type: string
          maxLength: 200
          description: Required for a document — it is the link text.
    MediaReplaceRequest:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
    MediaPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        `alt` and `focalPoint` apply to images only; sending them for a document is a 400. A
        document's `title` cannot be cleared.
      properties:
        alt:
          type: string
          minLength: 1
          maxLength: 300
        title:
          type:
            - string
            - 'null'
          maxLength: 200
        focalPoint:
          type: object
          additionalProperties: false
          required:
            - x
            - 'y'
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            'y':
              type: number
              minimum: 0
              maximum: 1
