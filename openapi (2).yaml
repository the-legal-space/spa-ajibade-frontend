  /api/v1/admin/applications/{id}/cv:
    get:
      tags:
        - Admin submissions
      operationId: getApplicationCv
      summary: A short-lived link to the CV
      description: |
        CVs are never publicly served. This returns a signed URL valid for five
        minutes, and every call is audit-logged with the actor — so who read
        whose CV, and when, is always answerable.

        A CV that has not passed the virus scan is refused with 409, whatever
        its status: `pending` means the scan has not finished, and `infected`
        means the file must never be handed to anybody.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: The link, and when it stops working.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SignedFileUrl'
              example:
                data:
                  url: https://storage.example.com/cv/1a2b3c?signature=...&expires=1780000000
                  expiresAt: '2026-06-01T12:05:00.000Z'
                  filename: adaeze-nwosu-cv.pdf
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/files/cv/{key}:
    get:
      tags:
        - Admin submissions
      operationId: downloadSignedCv
      summary: Redeem a signed CV link
      description: |
        Serves a CV to whoever holds a valid, unexpired signature. There is no
        bearer token: the signature *is* the authorisation, exactly as with a
        presigned S3 URL. It is issued only by `GET /admin/applications/{id}/cv`,
        which is HR-only and audit-logged, it covers the key and the expiry, and
        it stops working after five minutes.

        This path exists **only** when the API runs on the `local` private
        storage driver, which is development and staging. In production the
        driver is S3 and the link points at AWS, so this route is not mounted
        at all.
      parameters:
        - name: key
          in: path
          required: true
          description: The stored file's key, as the signed link carries it.
          schema:
            type: string
            pattern: ^[0-9a-fA-F-]{36}\.(pdf|docx)$
        - name: expires
          in: query
          required: true
          description: Unix seconds. Part of what the signature covers.
          schema:
            type: string
        - name: signature
          in: query
          required: true
          schema:
            type: string
        - name: filename
          in: query
          required: false
          description: The name to save the download under.
          schema:
            type: string
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: |
            The signature is wrong, or the link has expired. One answer for
            both, so a caller cannot learn whether a key exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/{id}/revoke-sessions:
    post:
      tags:
        - Admin users
      operationId: revokeUserSessions
      summary: End every session a user holds
      description: |
        Signs an account out everywhere, without needing their password. This
        is what an administrator uses when an account is compromised: it
        revokes the refresh chain *and* invalidates the access tokens already
        issued, so a stolen bearer token stops working on its next request
        rather than at the end of its fifteen minutes.

        Does not change the password and does not deactivate the account —
        both are separate, deliberate steps (see `docs/RUNBOOK.md`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '204':
          description: Every session ended.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An admin access token. On public content endpoints it is optional and only meaningful
        together with `?preview=true`, which includes draft content in the response.
  parameters:
    Preview:
      name: preview
      in: query
      required: false
      description: |
        Include draft content. Ignored unless the request also carries a valid admin bearer token.
      schema:
        type: boolean
        default: false
    PageKey:
      name: key
      in: path
      required: true
      description: Which page to compose.
      schema:
        $ref: '#/components/schemas/PageKey'
    Slug:
      name: slug
      in: path
      required: true
      description: The resource slug.
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 140
      example: dispute-resolution-arbitration
    ObjectId:
      name: id
      in: path
      required: true
      description: A 24-character hexadecimal identifier.
      schema:
        $ref: '#/components/schemas/ObjectId'
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number. Out-of-range pages return an empty list, not a 404.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 9
    PersonRole:
      name: role
      in: query
      required: false
      description: |
        Filter the directory by role. Omit for every attorney.

        These are the directory's **tab groups**, not strictly the stored role:
        `partner` also returns the managing partner, because the designs have a
        "Partners" tab and no separate Managing Partner tab. Every other value
        matches its role exactly. The `role` field on each result is always the
        attorney's own role, so a person returned under `partner` may come back
        with `role: "managing_partner"`.
      schema:
        $ref: '#/components/schemas/PersonRoleFilter'
    PersonSort:
      name: sort
      in: query
      required: false
      description: Directory sort order.
      schema:
        type: string
        enum:
          - seniority
          - name_asc
          - name_desc
        default: seniority
    InsightCategory:
      name: category
      in: query
      required: false
      description: Filter by category. Omit for all categories.
      schema:
        $ref: '#/components/schemas/InsightCategory'
    PracticeAreaFilter:
      name: practiceArea
      in: query
      required: false
      description: |
        Filter by practice area slug — the "Practice Area" dropdown. On `/people` it matches an
        attorney's `practiceAreas` or `primaryPracticeArea`. An unknown slug returns an empty
        page, not a 404, because the value comes from a filter control.
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 140
    InsightSort:
      name: sort
      in: query
      required: false
      description: Listing sort order.
      schema:
        type: string
        enum:
          - newest
          - oldest
        default: newest
    LegalKey:
      name: key
      in: path
      required: true
      description: Which legal page. `terms` and `privacy` exist; any other key is a 404.
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 40
      example: terms
    SearchQuery:
      name: q
      in: query
      required: true
      description: The search term.
      schema:
        type: string
        minLength: 2
        maxLength: 100
      example: arbitration
    AdminStatus:
      name: status
      in: query
      required: false
      description: Filter by status. Omit for every status, which is the admin default.
      schema:
        type: string
        enum:
          - draft
          - published
    AdminSearch:
      name: q
      in: query
      required: false
      description: Free-text filter over the collection's searchable fields.
      schema:
        type: string
        maxLength: 200
    SubmissionStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by status. Omit for every status.
      schema:
        $ref: '#/components/schemas/SubmissionStatus'
    ApplicationStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by hiring stage. Omit for every stage.
      schema:
        $ref: '#/components/schemas/ApplicationStatus'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `revision` read from the GET. A stale value returns 409 with the
        current revision, so two editors cannot silently overwrite each other.
      schema:
        type: string
  responses:
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request
                  details:
                    - path: email
                      message: Invalid email
    NotFound:
      description: No published resource matches.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Not found
    PayloadTooLarge:
      description: |
        The upload exceeds the limit for what it is: 5 MB for a CV, 10 MB for an image, 20 MB
        for a PDF document.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: The uploaded file exceeds the 5 MB limit.
    UnsupportedMediaType:
      description: |
        The file's bytes are not a type this upload accepts: a PDF or DOCX for a CV; a JPEG, PNG,
        WebP or AVIF for an image; a PDF for a document.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Only PDF and DOCX files are accepted.
    UnprocessableEntity:
      description: |
        The uploaded file was rejected after inspection and nothing was stored. Today this
        means it failed the virus scan: a CV, or a PDF document for the media library. Distinct from 400, which means a field was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FILE_REJECTED
              message: The uploaded file could not be accepted.
    Unauthenticated:
      description: |
        No valid credentials.
        which means the password was right and a code is needed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Invalid email or password
    Forbidden:
      description: Authenticated, but not permitted to act in this area.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You do not have access to this resource
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: An account with that email already exists
    PreconditionRequired:
      description: The write needs an `If-Match` header carrying the revision read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: An If-Match header carrying the current revision is required
