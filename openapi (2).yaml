  schemas:
    ObjectId:
      type: string
      pattern: ^[0-9a-f]{24}$
      description: A 24-character hexadecimal MongoDB identifier.
      examples:
        - 665f1a2b3c4d5e6f70819293
    Slug:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      maxLength: 140
      description: A lowercase kebab-case identifier, unique within its collection.
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - db
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        db:
          type: string
          enum:
            - up
            - down
        version:
          type: string
          description: The deployed API version.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - FILE_REJECTED
        - RATE_LIMITED
        - INTERNAL
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - path
        - message
      properties:
        path:
          type: string
          description: A dotted path to the offending field.
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ImageSizes:
      type: object
      additionalProperties: false
      required:
        - sm
        - md
        - lg
      description: Responsive variants, roughly 480, 960 and 1440 pixels wide.
      properties:
        sm:
          type: string
        md:
          type: string
        lg:
          type: string
    Image:
      type: object
      additionalProperties: false
      required:
        - url
        - alt
        - width
        - height
        - sizes
        - focalPoint
      description: Images are always this shape, never a bare URL string.
      properties:
        url:
          type: string
        alt:
          type: string
          description: Required on every image. The admin UI enforces it on upload.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sizes:
          $ref: '#/components/schemas/ImageSizes'
        focalPoint:
          type: object
          additionalProperties: false
          required:
            - x
            - 'y'
          description: Relative focal point used for art-directed cropping.
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            'y':
              type: number
              minimum: 0
              maximum: 1
    NullableImage:
      oneOf:
        - $ref: '#/components/schemas/Image'
        - type: 'null'
      description: Null until the firm uploads an image through the admin UI.
    Document:
      type: object
      additionalProperties: false
      required:
        - url
        - title
        - bytes
        - mimeType
      description: |
        An uploaded PDF from the media library, such as the firm profile. Documents have no
        responsive sizes and no alt text; `title` is what a link to one should read.
      properties:
        url:
          type: string
        title:
          type: string
        bytes:
          type: integer
          minimum: 1
        mimeType:
          type: string
          enum:
            - application/pdf
    NullableDocument:
      oneOf:
        - $ref: '#/components/schemas/Document'
        - type: 'null'
      description: Null until the firm uploads the document through the admin UI.
    LinkKind:
      type: string
      enum:
        - internal
        - external
        - action
      description: |
        `internal` is a path on the site, `external` an absolute URL, and `action` one of the
        frontend-resolved actions: `action:mandate`, `action:chat`, `action:message`,
        `action:call`.
    Link:
      type: object
      additionalProperties: false
      required:
        - label
        - href
        - kind
      properties:
        label:
          type: string
        href:
          type: string
        kind:
          $ref: '#/components/schemas/LinkKind'
    NullableLink:
      oneOf:
        - $ref: '#/components/schemas/Link'
        - type: 'null'
    PendingLink:
      type: object
      additionalProperties: false
      required:
        - label
        - href
        - kind
      description: |
        A call to action the design shows before its destination is decided. The label is real
        copy; `href` and `kind` are both null until the firm decides where it goes, and are
        then both set, exactly as on a `Link`.
      properties:
        label:
          type: string
        href:
          type:
            - string
            - 'null'
        kind:
          oneOf:
            - $ref: '#/components/schemas/LinkKind'
            - type: 'null'
    SectionHeader:
      type: object
      additionalProperties: false
      required:
        - eyebrow
        - title
        - cta
      description: The eyebrow/title/CTA trio that opens most sections. Unused parts are null.
      properties:
        eyebrow:
          type:
            - string
            - 'null'
        title:
          type: string
        cta:
          $ref: '#/components/schemas/NullableLink'
    IconItem:
      type: object
      additionalProperties: false
      required:
        - icon
        - title
        - text
      properties:
        icon:
          type: string
          description: An icon key the frontend maps to its own icon set, such as `shield-plus`.
        title:
          type: string
        text:
          type:
            - string
            - 'null'
    Stat:
      type: object
      additionalProperties: false
      required:
        - value
        - caption
        - label
      description: |
        Computed stats are already resolved here; the `source` field is admin-only.
      properties:
        value:
          type: string
          examples:
            - 59+ Years
        caption:
          type: string
        label:
          type: string
    SeoBasic:
      type: object
      additionalProperties: false
      required:
        - title
        - description
      description: |
        Search metadata for a collection item. Unlike a page's `Seo`, there is no
        `ogImage`: only pages carry an Open Graph image.
      properties:
        title:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
    Seo:
      type: object
      additionalProperties: false
      required:
        - title
        - description
        - ogImage
      properties:
        title:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        ogImage:
          $ref: '#/components/schemas/NullableImage'
    Hero:
      type: object
      additionalProperties: false
      required:
        - title
        - subtitle
        - images
        - primaryCta
        - secondaryCta
      properties:
        title:
          type: string
        subtitle:
          type:
            - string
            - 'null'
        images:
          type: array
          description: |
            The hero's background slides. Only the image changes between slides; the title,
            subtitle and CTAs are shared. Home has three in the designs and every other hero
            one. Empty until the firm uploads a picture, the way a single image used to be null.
          items:
            $ref: '#/components/schemas/Image'
        primaryCta:
          $ref: '#/components/schemas/NullableLink'
        secondaryCta:
          $ref: '#/components/schemas/NullableLink'
    FilterOption:
      type: object
      additionalProperties: false
      required:
        - value
        - label
      description: A filter tab. An empty `value` means "no filter", such as "Our Attorneys".
      properties:
        value:
          type: string
        label:
          type: string
    PersonRole:
      type: string
      enum:
        - managing_partner
        - partner
        - associate_partner
        - senior_associate
        - associate
        - trainee_associate
    PersonRoleFilter:
      type: string
      enum:
        - managing_partner
        - partner
        - associate_partner
        - senior_associate
        - associate
        - trainee_associate
      description: |
        The accepted values of the `role` query parameter. Same values as `PersonRole`, but
        `partner` behaves as a group and also matches `managing_partner`, mirroring the
        "Partners" tab in the designs. `managing_partner` is accepted for an exact match even
        though the directory shows no tab for it.
    InsightCategory:
      type: string
