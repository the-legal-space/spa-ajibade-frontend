        `pro_bono` ("Pro Bono & Community Commitment") is not a listing tab: those insights are
        the Responsible Business page's stories, and appear in a listing only when
        `category=pro_bono` is asked for explicitly.
    InsightFormat:
      type: string
      enum:
        - article
        - video
      description: Controls whether the card reads "Read More" or "Watch Video".
    EmploymentType:
      type: string
      enum:
        - full_time
        - part_time
        - contract
        - internship
        - nysc
    WorkMode:
      type: string
      enum:
        - onsite
        - hybrid
        - remote
    PageKey:
      type: string
      enum:
        - home
        - about
        - practice-areas
        - people
        - insights
        - careers
        - faq
        - offices
        - recognition
        - responsible-business
    LegalPageKey:
      type: string
      enum:
        - terms
        - privacy
    PracticeAreaRef:
