# Builds the site for the firm's cPanel (Setup Node.js App) and publishes the result to the
# `cpanel-build` branch, which cPanel's Git Version Control clones into ~/spa-frontend.
# Also attaches spa-frontend.zip to the `cpanel-latest` release (fallback: upload + extract in File Manager).
#
# Builds on Linux x64 so native packages match the server, and in a clean runner so no .env file
# (secrets) can end up in the published output. Server secrets are entered in cPanel, never here.
# Deploys nothing by itself: someone still clicks "Update from Remote" and "Restart" in cPanel.
#
# Repo Settings > Secrets and variables > Actions > Variables (public values only):
#   NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_CONSENT_TEXT_VERSION, NEXT_PUBLIC_TURNSTILE_SITE_KEY

name: Build for cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cpanel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_OUTPUT: standalone
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CONSENT_TEXT_VERSION: ${{ vars.NEXT_PUBLIC_CONSENT_TEXT_VERSION }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the public build settings
        run: |
          missing=0
          for v in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!v}" ]; then echo "::error::Repo variable $v is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Assemble the cPanel app folder
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          cp -a .next/standalone/. dist/
          mkdir -p dist/.next && cp -a .next/static dist/.next/static
          cp -a public dist/public
          cp deploy/cpanel/preflight.js dist/preflight.js
          # Passenger's restart trigger lives here; keep the folder in git.
          mkdir -p dist/tmp && touch dist/tmp/.keep
          cat > dist/DEPLOY.md <<EOF
          Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%MZ).
          Startup file: server.js (preflight.js for the pre-launch check). Do not run NPM Install.
          See deploy/cpanel/MIGRATION-PLAN.md on main.
          EOF

      - name: Refuse to publish secrets
        run: |
          set -euo pipefail
          found=$(find dist -name '.env*' -not -path '*/node_modules/*' -print)
          if [ -n "$found" ]; then echo "::error::.env files in the build output:"; echo "$found"; exit 1; fi
          if grep -rIlE 'mongodb(\+srv)?://[^"[:space:]]*:[^"[:space:]]*@' dist --exclude-dir=node_modules; then
            echo "::error::A MongoDB connection string with a password is baked into the build"; exit 1
          fi

      - name: Publish to the cpanel-build branch
        working-directory: dist
        run: |
          set -euo pipefail
          git init -q -b cpanel-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7} for cPanel"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" cpanel-build

      - name: Attach spa-frontend.zip to the cpanel-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd dist && rm -rf .git && zip -qr ../spa-frontend.zip .)
          gh release delete cpanel-latest --yes --cleanup-tag || true
          gh release create cpanel-latest spa-frontend.zip --target "$GITHUB_SHA" --latest=false \
            --title "cPanel build ${GITHUB_SHA::7}" \
            --notes "Fallback for cPanel without Git: upload spa-frontend.zip to ~/spa-frontend in File Manager and extract it there."
