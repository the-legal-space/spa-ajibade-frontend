# Builds the site for the firm's cPanel (Setup Node.js App) and publishes the built app to a branch
# that cPanel's Git Version Control clones into ~/spa-frontend:
#   main    -> `cpanel-build`          (production)
#   preprod -> `cpanel-build-preprod`  (testing on cPanel before a release; Vercel production is untouched)
# Also attaches spa-frontend.zip to a release (`cpanel-latest` / `cpanel-preprod`) as a fallback:
# upload + extract in File Manager.
#
# Builds on Linux x64 so native packages match the server, and in a clean runner so no .env file
# (secrets) can end up in the published output. Server secrets are entered in cPanel, never here.
# Deploys nothing by itself: someone still clicks "Update from Remote" and "Restart" in cPanel.
#
# Repo Settings > Secrets and variables > Actions > Variables (public values only):
#   NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_CONSENT_TEXT_VERSION, NEXT_PUBLIC_TURNSTILE_SITE_KEY

name: Build for cPanel

on:
  push:
    branches: [main, preprod]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cpanel
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26, and the build must match the server's x64 glibc.
    runs-on: ubuntu-24.04
    env:
      NEXT_OUTPUT: standalone
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CONSENT_TEXT_VERSION: ${{ vars.NEXT_PUBLIC_CONSENT_TEXT_VERSION }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      OUT_BRANCH: ${{ github.ref_name == 'main' && 'cpanel-build' || 'cpanel-build-preprod' }}
      RELEASE_TAG: ${{ github.ref_name == 'main' && 'cpanel-latest' || 'cpanel-preprod' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the public build settings
        run: |
          missing=0
          for v in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!v}" ]; then echo "::error::Repo variable $v is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Assemble the cPanel app folder
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          cp -a .next/standalone/. dist/
          mkdir -p dist/.next && cp -a .next/static dist/.next/static
          # Merge into the public/ the standalone output may already contain (copying the folder itself
          # would nest it as public/public/ and break every /figma/ image).
          mkdir -p dist/public && cp -a public/. dist/public/
          cp deploy/cpanel/preflight.js dist/preflight.js
          # Passenger's restart trigger lives here; keep the folder in git.
          mkdir -p dist/tmp && touch dist/tmp/.keep
          cat > dist/DEPLOY.md <<EOF
          Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${GITHUB_REF_NAME}) on $(date -u +%Y-%m-%dT%H:%MZ).
          Startup file: server.js (preflight.js for the pre-launch check). Do not run NPM Install.
          See deploy/cpanel/MIGRATION-PLAN.md on main.
          EOF

      - name: Refuse to publish secrets
        run: |
          set -euo pipefail
          found=$(find dist -name '.env*' -not -path '*/node_modules/*' -print)
          if [ -n "$found" ]; then echo "::error::.env files in the build output:"; echo "$found"; exit 1; fi
          if grep -rIlE 'mongodb(\+srv)?://[^"[:space:]]*:[^"[:space:]]*@' dist --exclude-dir=node_modules; then
            echo "::error::A MongoDB connection string with a password is baked into the build"; exit 1
          fi

      - name: Publish to the build branch
        working-directory: dist
        run: |
          set -euo pipefail
          remote="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b "$OUT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each build is a child of the previous one, so cPanel's "Update from Remote" (a fast-forward
          # pull) works. A build with unrelated history makes cPanel fail with "could not contact the
          # remote repository".
          if git fetch -q --depth=1 "$remote" "$OUT_BRANCH"; then
            git reset -q --soft FETCH_HEAD
          fi
          git add -A
          git commit -q --allow-empty -m "Build of ${GITHUB_REF_NAME}@${GITHUB_SHA::7} for cPanel"
          git push -q "$remote" "HEAD:refs/heads/$OUT_BRANCH"

      - name: Attach spa-frontend.zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd dist && rm -rf .git && zip -qr ../spa-frontend.zip .)
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" spa-frontend.zip --target "$GITHUB_SHA" --latest=false --prerelease \
            --title "cPanel build ${GITHUB_REF_NAME}@${GITHUB_SHA::7}" \
            --notes "Fallback for cPanel without Git: upload spa-frontend.zip to ~/spa-frontend in File Manager and extract it there."
